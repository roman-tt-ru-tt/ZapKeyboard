plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zap.keyboard'
    compileSdk 33

    defaultConfig {
        applicationId "com.zap.keyboard"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("zap-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "zap2024"
            keyAlias System.getenv("KEY_ALIAS") ?: "zap"
            keyPassword System.getenv("KEY_PASSWORD") ?: "zap2024"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
